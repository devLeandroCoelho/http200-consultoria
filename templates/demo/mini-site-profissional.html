<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Mini Site Profissional</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; color: #0f172a; background: #fff; }
    .header { background: #0f172a; color: #fff; padding: 16px; text-align: center; }
    .header small { opacity: .7; font-size: 12px; }
    .hero { background: #f97316; color: #fff; padding: 48px 16px; text-align: center; }
    .section { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    .card h3 { margin-bottom: 8px; }
    .card p { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Mini Site Profissional</h1>
    <small>Demo interativa — este é um exemplo do template</small>
  </div>
  <div class="hero">
    <h2>João Silva</h2>
    <p>Desenvolvedor Freelancer</p>
  </div>
  <div class="section">
    <h3>Serviços</h3>
    <div class="cards">
      <div class="card"><h3>Sites</h3><p>Criação de sites profissionais.</p></div>
      <div class="card"><h3>Landing Pages</h3><p>Páginas de alta conversão.</p></div>
      <div class="card"><h3>SEO</h3><p>Otimização para Google.</p></div>
    </div>
  </div>
</body>
</html>
