<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Agendamento Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
    .navbar { background: #0f172a; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .navbar h1 { font-size: 18px; font-weight: 700; }
    .badge { background: #f97316; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .service { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid #e5e7eb; margin-bottom: 10px; }
    .service h3 { font-size: 15px; font-weight: 600; }
    .service p { font-size: 13px; color: #6b7280; margin-top: 4px; }
    .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 12px; }
    .slot { padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; background: #fff; text-align: center; cursor: pointer; font-weight: 500; font-size: 14px; }
    .slot.selected { background: #f97316; color: #fff; border-color: #f97316; }
    .cta { margin-top: 18px; width: 100%; padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 20px rgba(34,197,94,.3); }
    .step { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e7eb; margin-top: 16px; }
    .step h3 { font-size: 15px; margin-bottom: 8px; }
    .input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb; margin-top: 6px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>📅 Agendamento Online</h1>
    <span class="badge">DEMO</span>
  </div>
  <div class="container">
    <div class="service">
      <h3>Serviço</h3>
      <p>Consulta de acompanhamento • 40min</p>
    </div>
    <div class="service">
      <h3>Profissional</h3>
      <p>Dra. Ana Lima</p>
    </div>
    <div class="step">
      <h3>Escolha o horário</h3>
      <div class="slots" id="slots">
        <button class="slot" onclick="select(this)">09:00</button>
        <button class="slot selected" onclick="select(this)">10:00</button>
        <button class="slot" onclick="select(this)">11:00</button>
        <button class="slot" onclick="select(this)">14:00</button>
        <button class="slot" onclick="select(this)">15:00</button>
        <button class="slot" onclick="select(this)">16:00</button>
      </div>
    </div>
    <div class="step">
      <h3>Seus dados</h3>
      <input class="input" placeholder="Nome completo" />
      <input class="input" placeholder="WhatsApp" />
      <input class="input" placeholder="Email" />
    </div>
    <button class="cta">Confirmar Agendamento</button>
  </div>
  <script>
    function select(btn) {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      btn.classList.add('selected');
    }
  </script>
</body>
</html>
