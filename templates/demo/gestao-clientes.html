<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Gestão de Clientes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    .header { background: #0f172a; color: #fff; padding: 16px; text-align: center; }
    .header small { opacity: .7; font-size: 12px; }
    .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e7eb; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .tag { padding: 4px 8px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gestão de Clientes</h1>
    <small>Demo interativa — este é um exemplo do template</small>
  </div>
  <div class="container">
    <div class="card">
      <h2>Clientes</h2>
      <div class="row"><span>Maria Souza</span><span class="tag">VIP</span></div>
      <div class="row"><span>João Lima</span><span class="tag">Ativo</span></div>
      <div class="row"><span>Ana Pereira</span><span class="tag">Novo</span></div>
    </div>
  </div>
</body>
</html>
